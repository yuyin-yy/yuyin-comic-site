# Nginx 反向代理配置（不想用 Caddy 就用这个）
# ---------------------------------------------------------------
# 1. 放到 /etc/nginx/sites-available/comic.conf 并软链到 sites-enabled
# 2. 改掉 server_name
# 3. nginx -t && systemctl reload nginx
# 4. HTTPS 用 certbot：certbot --nginx -d comic.example.com

server {
    listen 80;
    listen [::]:80;
    server_name comic.example.com;

    # 本站没有文件上传接口，请求体限制得很紧
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 访问日志
    access_log /var/log/nginx/comic.access.log;
    error_log  /var/log/nginx/comic.error.log warn;

    # 封面图：7 天强缓存，减少回源
    location /imgs/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 其余请求全部交给 Node
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
