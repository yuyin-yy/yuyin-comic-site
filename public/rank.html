<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 内容是第三方素材索引，不参与搜索引擎收录 -->
  <meta name="robots" content="noindex, nofollow">
  <title>排行榜 · 余音的小破站</title>
  <meta name="description" content="按热度、评分、更新时间与完结状态排行的漫画榜单，附冠军作品速览与热门题材入口。">
  <meta name="theme-color" content="#f5f3ef">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/rank.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="imgs/offen/webtitle.png" sizes="any">
</head>

<!-- 排行榜：?board=hot|score|fresh|end 切换榜单，?range=day|week|month|all 切换时间范围（见 js/pages/rank.js） -->
<body data-page="rank">
  <header id="app-nav"></header>

  <main>
    <div class="container rank-head">
      <!-- 榜单切换条：左侧榜单类型，右侧时间范围 -->
      <nav class="rank-bar" aria-label="榜单切换">
        <div class="rank-tabs" id="rankBoards">
          <a href="rank.html?board=hot" data-board="hot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3s5 4 5 8a5 5 0 0 1-10 0c0-2 1-3 1-3s0 3 2 3c1.5 0 1.5-1.6 1.5-3C11.5 6.4 12 3 12 3z" />
            </svg>人气榜
          </a>
          <a href="rank.html?board=score" data-board="score">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4 6.2 20.5l1.1-6.5L2.6 9.4l6.5-.9L12 2.6z" />
            </svg>评分榜
          </a>
          <a href="rank.html?board=fresh" data-board="fresh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 2" />
            </svg>更新榜
          </a>
          <a href="rank.html?board=end" data-board="end">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m5 12.5 4.5 4.5L19 7" />
            </svg>完结榜
          </a>
        </div>
        <div class="rank-ranges" id="rankRanges">
          <a href="rank.html?range=day" data-range="day">今日</a>
          <a href="rank.html?range=week" data-range="week">本周</a>
          <a href="rank.html?range=month" data-range="month">本月</a>
          <a href="rank.html?range=all" data-range="all">总榜</a>
        </div>
      </nav>

      <!-- 三栏：冠军海报 / 榜单表格 / 题材与说明 -->
      <div class="rank-wrap">
        <aside class="rank-hero-card" id="rankHero" aria-label="榜首作品"></aside>

        <section class="rank-table" aria-label="榜单列表">
          <div class="rank-table-head">
            <span>排名</span>
            <span>作品</span>
            <span>题材</span>
            <span>热度</span>
          </div>
          <div id="rankRows"></div>
        </section>

        <aside class="rank-side">
          <div class="side-card">
            <h3><i></i>热门题材</h3>
            <div class="tag-tiles" id="rankTags"></div>
          </div>
          <div class="side-card">
            <h3><i></i>评分最高</h3>
            <div class="side-list" id="rankScore"></div>
          </div>
          <div class="side-card">
            <h3><i></i>关于榜单</h3>
            <p class="side-note" id="rankNote"></p>
          </div>
        </aside>
      </div>

      <!-- 第 9 名之后：一行五列带封面继续排名次 -->
      <section class="rank-more" aria-label="更多排行">
        <div class="rank-more-head">
          <h2>更多排行</h2>
          <a class="link-more" href="category.html">
            按条件筛选
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>
        <div class="rank-grid" id="rankGrid"></div>
      </section>

    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui/nav.js"></script>
  <script src="js/ui/footer.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/mascot.js"></script>
  <script src="js/pages/rank.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
