<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>余音的小破站 · 漫画推荐与追更</title>
  <meta name="description" content="余音的小破站：整理日漫与国漫的连载进度、评分与简介，按热度推荐，支持关键词搜索与追漫收藏。">
  <meta name="theme-color" content="#f5f3ef">
  <!-- 样式按层拆分：基础 → 骨架 → 组件 → 页面 → 响应式 -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="icon" href="imgs/offen/webtitle.png" sizes="any">
</head>

<!-- 首页：Hero 搜索 + 人气推荐 + 侧栏榜单 + 最近更新（渲染逻辑见 js/pages/home.js） -->
<body data-page="home">
  <header id="app-nav"></header>

  <main>
    <!-- Hero -->
    <!-- Hero：主视觉 + 搜索入口，背景图取自 imgs/offen -->
    <section class="hero">
      <div class="hero-bg" aria-hidden="true"></div>
      <div class="container">
        <div class="hero-inner">
          <span class="eyebrow">余音的小破站 · 每日更新</span>
          <h1>在收录的漫画里，<br>找到属于今晚的<em>那一话</em></h1>
          <p class="hero-sub">
            日漫与国漫的连载进度、评分与简介，按热度整理成一份随时可查的清单。
          </p>

          <div class="hero-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="heroSearch" type="search" placeholder="搜索作品名、作者或题材，例如：芙莉莲" aria-label="搜索漫画">
            <button class="hero-search-btn" id="heroSearchBtn" type="button">搜索</button>
          </div>

          <div class="hero-tags">
            <a href="category.html?tag=热血">热血</a>
            <a href="category.html?tag=恋爱">恋爱</a>
            <a href="category.html?tag=奇幻">奇幻</a>
            <a href="category.html?region=国漫">国漫</a>
            <a href="category.html?sort=评分">高分</a>
          </div>

          <div class="hero-stats">
            <div><b id="statCount">34</b><span>收录作品</span></div>
            <div><b id="statOngoing">27</b><span>连载中</span></div>
            <div><b id="statTag">28</b><span>题材标签</span></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 主内容 -->
    <!-- 主内容：左侧推荐网格 + 右侧榜单（两栏布局见 pages.css） -->
    <section class="home-main">
      <div class="container">
        <div class="home-layout">
          <div>
            <div class="section-head">
              <h2 class="section-title">
                人气推荐
                <small>按评分与更新进度综合排序</small>
              </h2>
              <div class="segmented" id="homeTabs" role="tablist" aria-label="作品分类">
                <button type="button" data-group="all" aria-selected="true" role="tab">综合</button>
                <button type="button" data-group="guo" aria-selected="false" role="tab">国漫</button>
                <button type="button" data-group="ri" aria-selected="false" role="tab">日韩</button>
                <button type="button" data-group="love" aria-selected="false" role="tab">恋爱</button>
              </div>
            </div>
            <div class="grid" id="homeGrid"></div>
          </div>

          <aside aria-label="排行榜与更新">
            <div class="panel">
              <div class="panel-title">今日排行榜 <a href="rank.html">完整榜单 →</a></div>
              <div class="rank-list" id="homeRank"></div>
            </div>
            <div class="panel">
              <div class="panel-title">最近更新 <a href="updates.html">全部更新 →</a></div>
              <div class="update-list" id="homeUpdates"></div>
            </div>
            <div class="panel">
              <div class="panel-title">关于本站</div>
              <p style="font-size:13.5px;color:var(--muted);line-height:1.8">
                本站为个人漫画索引，仅收录作品信息与外部阅读链接，不存储任何漫画内容。
                数据由 <code style="font-size:12px">js/data.js</code> 统一维护，
                收藏记录保存在本地浏览器中。
              </p>
            </div>
          </aside>
        </div>
      </div>
    </section>

    <!-- 最新上架 -->
    <!-- 最近更新：按 updated 倒序取 10 部 -->
    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2 class="section-title">
            最近更新
            <small>刚刚跟进过进度的作品</small>
          </h2>
          <a class="link-more" href="category.html">
            查看全部
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </a>
        </div>
        <div class="grid" id="homeLatest"></div>
      </div>
    </section>
  </main>

  <footer id="app-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui/nav.js"></script>
  <script src="js/ui/footer.js"></script>
  <script src="js/ui/card.js"></script>
  <script src="js/ui/mascot.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
